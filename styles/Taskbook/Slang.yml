# Раздел «Терминология и иноязычные слова» → «Сленг» и глоссарий
extends: substitution
message: "Используйте «%s» вместо «%s»."
level: error
ignorecase: true
swap:
  кликн\p{L}*: нажмите
  тапн\p{L}*: нажмите
  залогин\p{L}*: войти
  разлогин\p{L}*: выйти
  юзер\p{L}*: пользователь
  фич(?:а|и|у|ей|е|ам|ами|ах)?: функция
  баг(?:а|и|у|ом|ов|ам|ами|ах)?: ошибка
  апдейт\p{L}*: обновление
  таск(?:а|и|у|ом|е|ов|ам|ами|ах)?: задача
  тикет\p{L}*: задача
  дедлайн\p{L}*: срок
  воркспейс\p{L}*: пространство
  админ(?:а|у|ом|е|ы|ов|ам|ами|ах)?: администратор
  оффлайн: офлайн
