# Раздел «Построение предложений» → «Канцелярит»
extends: existence
message: "Канцелярит «%s»: перепишите проще. См. раздел «Построение предложений»."
level: warning
ignorecase: true
tokens:
  - данн(?:ый|ая|ое|ые|ого|ой|ом|ым|ых|ую|ыми)
  - осуществ\p{L}*
  - являет(?:ся|ются)
  - посредством
  - в целях
  - на сегодняшний день
  - в случае если
  - производит(?:ся|ь)
