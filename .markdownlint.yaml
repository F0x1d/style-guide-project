# Правила markdownlint для документации «Таскбука».
# Описание правил: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
default: true

# Заголовки только через #
MD003:
  style: atx

# Маркированные списки только через -
MD004:
  style: dash

# Вложенные списки сдвигаются на 4 пробела: этого требует MkDocs
MD007:
  indent: 4

# Длина строки не ограничена: один абзац — одна строка
MD013: false

# Одинаковые заголовки допустимы в разных разделах
MD024:
  siblings_only: true

# Нумерованные списки: 1. в каждом пункте
MD029:
  style: one

# HTML в Markdown запрещён
MD033: true

# Блоки-примечания MkDocs используют отступ в 4 пробела,
# поэтому markdownlint ошибочно принимает их за блоки кода с отступом
MD046: false

# Полужирный — **текст**, курсив — *текст*
MD049:
  style: asterisk
MD050:
  style: asterisk
